name: TWINS public smoke test

on:
  schedule:
    # 06:17 JST every day. Scheduled workflows run from the default branch.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twins-public-smoke
  cancel-in-progress: true

jobs:
  public-login-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public TWINS login contract
        run: ./scripts/live-smoke.sh
